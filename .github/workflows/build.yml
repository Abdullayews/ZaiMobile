name: Build APK (Rust)

on:
  push:
    branches: [main]
  workflow_dispatch:

# eyni anda yalnız son build işləsin — köhnələri ləğv et
concurrency:
  group: build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust quraşdır
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust keş
        uses: Swatinem/rust-cache@v2

      # ubuntu-latest-da Android SDK hazır olur (ANDROID_HOME) — yalnız NDK lazımdır
      - name: NDK quraşdır
        run: |
          SDKM=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          $SDKM --version
          yes | $SDKM --licenses > /dev/null || true
          $SDKM --install "ndk;27.2.12479018" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV
          echo "TOOLCHAIN=$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_ENV

          # build-tools və platform dinamik tap
          BT=$(ls $ANDROID_HOME/build-tools/ | sort -V | tail -1)
          PLAT=$(ls $ANDROID_HOME/platforms/ | sort -V | tail -1)
          echo "BT_VER=$BT" >> $GITHUB_ENV
          echo "PLAT_VER=$PLAT" >> $GITHUB_ENV
          echo "BUILD_TOOLS=$ANDROID_HOME/build-tools/$BT" >> $GITHUB_ENV
          echo "PLATFORM_JAR=$ANDROID_HOME/platforms/$PLAT/android.jar" >> $GITHUB_ENV
          echo "build-tools: $BT | platforms: $PLAT"
          ls $ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang

      - name: Build (aarch64-linux-android)
        run: |
          export AR=$TOOLCHAIN/llvm-ar
          export CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android24-clang
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android24-clang
          export RUSTFLAGS="-C link-arg=-landroid"
          cargo build --release --target aarch64-linux-android --lib
          ls -la target/aarch64-linux-android/release/libzai_mobile.so

      - name: APK yığ
        run: |
          set -e
          BT=$BUILD_TOOLS
          JAR=$PLATFORM_JAR
          SO=target/aarch64-linux-android/release/libzai_mobile.so
          VC=${{ github.run_number }}
          VN=4.0.0-beta.$VC
          APK=ZaiMobile-v$VN.apk
          echo "APK_NAME=$APK" >> $GITHUB_ENV
          echo "VERSION_NAME=$VN" >> $GITHUB_ENV

          rm -rf build && mkdir -p build/lib/arm64-v8a
          cp $SO build/lib/arm64-v8a/

          # res kompilyasiya + link (manifest + ikonlar)
          $BT/aapt2 compile --dir res -o build/res.zip
          $BT/aapt2 link -o build/app-unsigned.apk \
            --manifest AndroidManifest.xml \
            -I $JAR \
            --min-sdk-version 24 --target-sdk-version 35 \
            --version-code $VC --version-name $VN \
            build/res.zip

          # .so faylını düzgün qovluq yolu ilə əlavə et
          cd build
          zip -q app-unsigned.apk lib/arm64-v8a/libzai_mobile.so
          cd ..

          # hizala + imzala
          $BT/zipalign -f -p 4 build/app-unsigned.apk build/app-aligned.apk
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > build/zai-release.keystore
          $BT/apksigner sign \
            --ks build/zai-release.keystore \
            --ks-key-alias zai \
            --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --key-pass pass:${{ secrets.KEY_PASSWORD }} \
            --out $APK build/app-aligned.apk
          $BT/apksigner verify --print-certs $APK | head -4
          ls -la $APK

      - name: Artifakt
        uses: actions/upload-artifact@v4
        with:
          name: ZaiMobile-${{ env.VERSION_NAME }}
          path: ${{ env.APK_NAME }}

      - name: Beta Release (pre-release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.0.0-beta.${{ github.run_number }}
          name: Z.ai Native v4.0.0-beta.${{ github.run_number }} (Beta)
          body: |
            ⚡ **Beta buraxılış** — hər push-da GitHub Actions-da avtomatik qurulur və imzalanır.

            **v4.0 — TAM SIFIRDAN YENİDƏN YAZILIB: Slint UI + Skia render (egui silindi).**

            • Yeni UI mühərriki: Slint 1.18 (backend-android-activity) — Android-də NativeActivity + Skia,
              klaviatura (IME), clipboard və toxunma Slint-in rəsmi Android dəstəyi ilə
            • Veb UI-nun dəqiq replikası: welcome "More than coding...", 2 sütunlu 5 təklif kartı,
              model popup (Effort səviyyələri model metadata-sından), tarixçə drawer, sign-in modal
            • Veb protokolu tam: guest token, /api/models (min_available_level filtri), chats/new,
              v2 completions SSE (imza HMAC-SHA256), chat yeniləmə, silmə, tarixçədən açma
            • WAF (Alibaba CDN 405) bloklarına qarşı avtomatik retry — veb app-də belə yoxdur!
            • FRONTEND_CAPTCHA_REQUIRED aşkarlanması + aydın istifadəçi yönləndirməsi
              (hesabla daxil ol / token yapışdır — brauzerdə captcha həll olunur)
            • 3 giriş yolu: Email+şifrə, Account token (localStorage-dan), Qonaq
            • Markdown render: başlıq, siyahı, sitat, kod blokları (dil + copy düyməsi)
            • Mesaj əməliyyatları: copy, regenerate, stop, avtomatik aşağı sürüşmə, "aşağı" düyməsi
            • Sessiya saxlanması (state.json), 401-də avtomatik qonaq bərpası, 150s axın watchdog
            • Şriftlər binariyə gömülüb (Carlito/Crimson/DejaVu Mono) — mətn həmişə render olunur
            • 100% Rust — WebView yoxdur

            **Quraşdırma:** APK-nı endirin → telefonda açın → "Naməlum mənbələrdən quraşdırmaya" icazə verin.
            Köhnə versiya üzərinə quraşdırıla bilər (eyni imza açarı).

            > Beta statusu: stabil buraxılış üçün əsas axın hələ "Latest" kimi işarələnmir.
          files: ${{ env.APK_NAME }}
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
