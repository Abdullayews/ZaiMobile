name: Build APK (Rust)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust quraşdır
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust keş
        uses: Swatinem/rust-cache@v2

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: NDK komponentləri
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;27.2.12479018" "platforms;android-35" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: NDK mühiti
        run: |
          TC=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          echo "TOOLCHAIN=$TC" >> $GITHUB_ENV
          $TC/aarch64-linux-android24-clang --version | head -1

      - name: Build (aarch64-linux-android)
        run: |
          export AR=$TOOLCHAIN/llvm-ar
          export CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android24-clang
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android24-clang
          export RUSTFLAGS="-C link-arg=-landroid"
          cargo build --release --target aarch64-linux-android --lib
          ls -la target/aarch64-linux-android/release/libzai_mobile.so

      - name: APK yığ
        run: |
          set -e
          BT=$ANDROID_HOME/build-tools/34.0.0
          SO=target/aarch64-linux-android/release/libzai_mobile.so

          rm -rf build && mkdir -p build/lib/arm64-v8a
          cp $SO build/lib/arm64-v8a/

          # res kompilyasiya + link (manifest + ikonlar)
          $BT/aapt2 compile --dir res -o build/res.zip
          $BT/aapt2 link -o build/app-unsigned.apk \
            --manifest AndroidManifest.xml \
            -I $ANDROID_HOME/platforms/android-35/android.jar \
            --min-sdk-version 24 --target-sdk-version 35 \
            --version-code 3 --version-name 2.0 \
            build/res.zip

          # .so faylını düzgün qovluq yolu ilə əlavə et
          cd build
          zip -q app-unsigned.apk lib/arm64-v8a/libzai_mobile.so
          cd ..

          # hizala + imzala
          $BT/zipalign -f -p 4 build/app-unsigned.apk build/app-aligned.apk
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > build/zai-release.keystore
          $BT/apksigner sign \
            --ks build/zai-release.keystore \
            --ks-key-alias zai \
            --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --key-pass pass:${{ secrets.KEY_PASSWORD }} \
            --out ZaiMobile-v2.0.apk build/app-aligned.apk
          $BT/apksigner verify --print-certs ZaiMobile-v2.0.apk | head -4
          ls -la ZaiMobile-v2.0.apk

      - name: Artifakt
        uses: actions/upload-artifact@v4
        with:
          name: ZaiMobile-v2.0
          path: ZaiMobile-v2.0.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0
          name: Z.ai Native v2.0 — 100% Rust
          body: |
            Tam native Rust versiyası — WebView tamamilə silindi.

            • 100% Rust (egui + GPU render) — brauzer yoxdur, ~10MB
            • chat.z.ai veb protokolu: signature + SSE streaming
            • Qonaq rejimi avtomatik + hesab tokeni ilə daxilolma
            • Söhbət tarixçəsi, markdown, kod blokları, kopyalama
            • Düşünmə / axtarış fazaları canlı göstərilir
            • Model seçimi (GLM-5.3 / Flash / 5.2)
          files: ZaiMobile-v2.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
