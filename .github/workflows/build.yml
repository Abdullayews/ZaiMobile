name: Build APK (Rust)

on:
  push:
    branches: [main]
  workflow_dispatch:

# eyni anda yalnız son build işləsin — köhnələri ləğv et
concurrency:
  group: build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust quraşdır
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: clippy

      - name: Rust keş
        uses: Swatinem/rust-cache@v2

      # ---- Keyfiyyət qapıları (build-dən ƏVVƏL — xətalı kod APK-a çatmasın) ----
      - name: Host asılılıqları (fontconfig — slint host preview üçün)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libfontconfig1-dev pkg-config > /dev/null

      - name: Clippy (host, -D warnings)
        run: cargo clippy --release --lib --bins -- -D warnings

      - name: Testlər (host)
        run: cargo test --release --lib

      # ubuntu-latest-da Android SDK hazır olur (ANDROID_HOME) — yalnız NDK lazımdır
      - name: NDK quraşdır
        run: |
          SDKM=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          $SDKM --version
          yes | $SDKM --licenses > /dev/null || true
          $SDKM --install "ndk;27.2.12479018" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV
          echo "TOOLCHAIN=$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_ENV

          # build-tools və platform dinamik tap
          BT=$(ls $ANDROID_HOME/build-tools/ | sort -V | tail -1)
          PLAT=$(ls $ANDROID_HOME/platforms/ | sort -V | tail -1)
          echo "BT_VER=$BT" >> $GITHUB_ENV
          echo "PLAT_VER=$PLAT" >> $GITHUB_ENV
          echo "BUILD_TOOLS=$ANDROID_HOME/build-tools/$BT" >> $GITHUB_ENV
          echo "PLATFORM_JAR=$ANDROID_HOME/platforms/$PLAT/android.jar" >> $GITHUB_ENV
          echo "build-tools: $BT | platforms: $PLAT"
          ls $ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang

      - name: Clippy (android target — JNI kodu)
        run: |
          export AR=$TOOLCHAIN/llvm-ar
          export CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android24-clang
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android24-clang
          export RUSTFLAGS="-C link-arg=-landroid"
          cargo clippy --release --target aarch64-linux-android --lib -- -D warnings

      - name: Build (aarch64-linux-android)
        run: |
          export AR=$TOOLCHAIN/llvm-ar
          export CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android24-clang
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android24-clang
          export RUSTFLAGS="-C link-arg=-landroid"
          cargo build --release --target aarch64-linux-android --lib
          ls -la target/aarch64-linux-android/release/libzai_mobile.so

      - name: Ölçü hesabatı
        run: |
          SO=target/aarch64-linux-android/release/libzai_mobile.so
          echo "=== HESABAT ==="
          echo ".so: $(stat -c%s $SO) bayt ($(du -h $SO | cut -f1))"
          echo "Assets (gömülü): $(du -sh assets | cut -f1) — fonts $(du -sh assets/fonts | cut -f1), kartlar $(du -sh assets/cards | cut -f1)"
          echo "Bağlı asılılıq sayı: $(cargo tree --target aarch64-linux-android --prefix none 2>/dev/null | grep -Eo '^[a-z0-9_-]+ v' | sort -u | wc -l)"

      - name: APK yığ
        run: |
          set -e
          BT=$BUILD_TOOLS
          JAR=$PLATFORM_JAR
          SO=target/aarch64-linux-android/release/libzai_mobile.so
          VC=${{ github.run_number }}
          VN=6.0.0-beta.$VC
          APK=ZaiMobile-v$VN.apk
          echo "APK_NAME=$APK" >> $GITHUB_ENV
          echo "VERSION_NAME=$VN" >> $GITHUB_ENV

          rm -rf build && mkdir -p build/lib/arm64-v8a
          cp $SO build/lib/arm64-v8a/

          # res kompilyasiya + link (manifest + ikonlar)
          $BT/aapt2 compile --dir res -o build/res.zip
          $BT/aapt2 link -o build/app-unsigned.apk \
            --manifest AndroidManifest.xml \
            -I $JAR \
            --min-sdk-version 24 --target-sdk-version 34 \
            --version-code $VC --version-name $VN \
            build/res.zip

          # .so faylını düzgün qovluq yolu ilə əlavə et
          cd build
          zip -q app-unsigned.apk lib/arm64-v8a/libzai_mobile.so
          cd ..

          # hizala + imzala
          $BT/zipalign -f -p 4 build/app-unsigned.apk build/app-aligned.apk
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > build/zai-release.keystore
          $BT/apksigner sign \
            --ks build/zai-release.keystore \
            --ks-key-alias zai \
            --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --key-pass pass:${{ secrets.KEY_PASSWORD }} \
            --out $APK build/app-aligned.apk
          $BT/apksigner verify --print-certs $APK | head -4
          ls -la $APK

      - name: Artifakt
        uses: actions/upload-artifact@v4
        with:
          name: ZaiMobile-${{ env.VERSION_NAME }}
          path: ${{ env.APK_NAME }}

      - name: Beta Release (pre-release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v6.0.0-beta.${{ github.run_number }}
          name: Z.ai Native v6.0.0-beta.${{ github.run_number }} (Beta)
          body: |
            ⚡ **Beta buraxılış** — hər push-da GitHub Actions-da avtomatik qurulur və imzalanır.

            **v6.0 — WEBVIEW YOXDUR: 100% native + adi hesab girişi (email + şifrə).**

            • **Adi hesab girişi**: Google / Email / Github düymələri (saytın kimi) → email + şifrə
              ilə birbaşa native giriş (POST /api/v1/auths/signin)
            • **Captcha fallback axını**: Z.ai captcha tələb etdikdə — sistem brauzerində bir dəfə
              giriş + clipboard-dan token aşkarlanması GÖSTƏRİLİR, yalnız siz "Sign in with detected
              token" düyməsinə toxunanda daxil olursunuz (razılıqsız heç nə oxunmur)
            • **Dark tema (standart)** + light — saytın dəqiq CSS palette-i (index CSS-dən götürülüb)
            • **Fayl əlavələri**: MediaStore native fayl seçici → serverə upload
              (multipart /api/v1/storage/pfs/files/upload) → image_url/video_url/file_url content massivi
              (şəkil, video, sənəd — saytın dəqiq protokolu)
            • **Avtomatik yenidən göndərmə**: "server busy" / şəbəkə xətalarında mesaj ƏLAVƏLƏR
              SAXLANILARAQ avtomatik təkrarlanır (4 cəhd, eksponensial gecikmə)
            • Tam veb protokolu: guest token, imza HMAC-SHA256, v2 completions SSE, WAF retry,
              watchdog (150s), 401-də avtomatik bərpa, tarixçə sinxronizasiyası
            • Rəsmi Z.ai loqosu (adaptive + monochrome ikonlar), welcome "More than coding...",
              5 təklif kartı, model popup (Effort), markdown + kod copy, clipboard copy
            • Sürətli açılış: paralel boot, model siyahısı arxa planda
          files: ${{ env.APK_NAME }}
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
