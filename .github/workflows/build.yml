name: Android APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: apk-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Kodu yüklə
        uses: actions/checkout@v4

      - name: JDK 17 quraşdır
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.7 quraşdır
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: İmza açarını deşifrə et
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/zai-release.keystore

      - name: Release APK qur
        env:
          ZAI_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ZAI_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ZAI_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APK-nı yenidən adlandır
        run: mv app/build/outputs/apk/release/app-release.apk ZaiMobile-v2.0-native.apk

      - name: APK-nı artifact kimi yüklə
        uses: actions/upload-artifact@v4
        with:
          name: ZaiMobile-APK
          path: ZaiMobile-v2.0-native.apk

      - name: GitHub Release yarat
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0
          name: Z.ai Mobile v2.0 — Tam nativ tətbiq
          body: |
            **Z.ai Mobile v2.0 — WebView deyil, tam nativ Android tətbiqi!**

            Mesanjer tipli öz interfeysi var — chat.z.ai saytı yüklənmir, birbaşa rəsmi API ilə işləyir.

            **Yeni xüsusiyyətlər:**
            - 🗨️ Tam nativ chat interfeysi (mesaj qabarcıqları, markdown render)
            - ⚡ Real-time stream cavablar (SSE)
            - 🧠 Düşünmə prosesini göstər/gizlət
            - 📚 Söhbət tarixçəsi (lokal SQLite, cihazdan kənar saxlanmır)
            - 🤖 Model seçimi (GLM-5.3-Flash qonaq üçün; GLM-5.3/5.2 premium)
            - 🔐 Qonaq rejimi avtomatik (qeydiyyat lazım deyil) və ya öz tokeninizlə premium
            - 🌙 Tünd rejim
            - 📋 Mesaj kopyalama, xətada yenidən cəhd, cavabı dayandır

            **Quraşdırma:** APK-nı endirin → telefonda açın → "Naməlum mənbələrdən quraşdırma" icazəsi verin.
            (v1.0 quraşdırılıbsa, v2.0 üzərinə yazılacaq)
          files: ZaiMobile-v2.0-native.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
