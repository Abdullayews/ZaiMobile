name: Build APK (Tauri)

on:
  push:
    branches: [main]
  workflow_dispatch:

# eyni anda yalnız son build işləsin
concurrency:
  group: build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Rust quraşdır
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust keş
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Android SDK/NDQ
        run: |
          SDKM=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKM --licenses > /dev/null || true
          $SDKM --install "ndk;27.2.12479018" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV
          echo "BT=$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_ENV

      - name: tauri-cli (prebuilt)
        run: |
          curl -sL "https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v2.12.4/cargo-tauri-x86_64-unknown-linux-gnu.tgz" -o /tmp/tc.tgz
          tar -xzf /tmp/tc.tgz -C $HOME/.cargo/bin
          chmod +x $HOME/.cargo/bin/cargo-tauri
          cargo tauri --version

      - name: Versiya (versionCode = run_number)
        run: |
          VC=${{ github.run_number }}
          VN=5.0.0-beta.$VC
          jq --arg v "$VN" --argjson vc "$VC" \
            '.version = $v | .bundle.android.versionCode = $vc' \
            src-tauri/tauri.conf.json > /tmp/tc.json && mv /tmp/tc.json src-tauri/tauri.conf.json
          echo "VN=$VN" >> $GITHUB_ENV
          echo "VC=$VC" >> $GITHUB_ENV
          cat src-tauri/tauri.conf.json | head -6

      - name: Build APK (aarch64)
        run: |
          cd src-tauri
          cargo tauri android build --apk --target aarch64
          ls -la gen/android/app/build/outputs/apk/universal/release/

      - name: İmzala
        run: |
          set -e
          cd src-tauri/gen/android/app/build/outputs/apk/universal/release
          IN=app-universal-release-unsigned.apk
          APK=ZaiMobile-v$VN.apk
          echo "APK_NAME=$APK" >> $GITHUB_ENV
          $BT/zipalign -f -p 4 $IN aligned.apk
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > zai-release.keystore
          $BT/apksigner sign \
            --ks zai-release.keystore \
            --ks-key-alias ${{ secrets.KEY_ALIAS }} \
            --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --key-pass pass:${{ secrets.KEY_PASSWORD }} \
            --out $APK aligned.apk
          $BT/apksigner verify --print-certs $APK | head -4
          ls -la $APK

      - name: Artifakt
        uses: actions/upload-artifact@v4
        with:
          name: ZaiMobile-${{ env.VN }}
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/${{ env.APK_NAME }}

      - name: Beta Release (pre-release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VN }}
          name: Z.ai Mobile v${{ env.VN }} (Beta)
          body: |
            ⚡ **Beta buraxılış** — GitHub Actions-da avtomatik qurulur və imzalanır.

            **v5.0 — "Eyni sistem": TAM SIFIRDAN, YENİ ARXİTEKTURA.**

            • Daxildə chat.z.ai-in ÖZ mühərriki işləyir — UI, məntiq, protokol,
              WAF/captcha hər biri saytın öz kodu ilə eynidir. Loqodan ən kiçik
              elementə qədər — hərfən saytın özü.
            • Native Android örtük (Tauri 2 + wry): sistem WebView mühərriki,
              imzalı APK, eyni paket adı (zai.mobile) — köhnə versiya üzərinə qurulur.
            • Fayl yükləmə: Android sistem fayl seçici (kamera dəstəyi ilə).
            • Fayl endirmə: a[download]/blob → MediaStore Downloads qovluğuna.
            • Pull-to-refresh: Chrome davranışı ilə eyni.
            • Offline: brendli "bağlantı yoxdur" ekrani + avtomatik yenidən qoşulma.
            • Xarici keçidlər (_blank, mailto, tel) → sistem brauzeri.
            • Back düyməsi: veb tarixçəsində geri, bitibsə app fonə keçir.

            **Quraşdırma:** APK-nı endirin → telefonda açın → "Naməlum mənbələrdən
            quraşdırmaya" icazə verin. Köhnə versiya üzərinə qurula bilər (eyni imza).
          files: src-tauri/gen/android/app/build/outputs/apk/universal/release/${{ env.APK_NAME }}
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
