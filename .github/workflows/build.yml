name: Build APK (Kotlin)

on:
  push:
    branches: [main]
  workflow_dispatch:

# eyni anda yalnız son build işləsin — köhnələri ləğv et
concurrency:
  group: build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK (platform-34 + build-tools 34)
        run: |
          SDKM=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKM --licenses > /dev/null || true
          $SDKM --install "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Versiya
        run: |
          VC=$((7000 + ${{ github.run_number }}))
          VN=7.0.0-beta.${{ github.run_number }}
          APK=ZaiMobile-v$VN.apk
          echo "VC=$VC" >> $GITHUB_ENV
          echo "APK_NAME=$APK" >> $GITHUB_ENV
          echo "VERSION_NAME=$VN" >> $GITHUB_ENV
          echo "versionCode=$VC versionName=$VN → $APK"

      - name: Testlər (unit + Robolectric smoke — pushdan əvvəl məcburi)
        run: gradle test --no-daemon

      - name: Build (release)
        run: gradle assembleRelease --no-daemon -PzaiVersionCode=$VC -PzaiVersionName=$VERSION_NAME

      - name: Ölçü hesabatı
        run: |
          APK_RAW=app/build/outputs/apk/release/app-release-unsigned.apk
          echo "=== HESABAT ==="
          echo "unsigned APK: $(stat -c%s $APK_RAW) bayt ($(du -h $APK_RAW | cut -f1))"
          echo "Yeganə xarici asılılıq: kotlinx-coroutines-android 1.8.1"

      - name: Hizala + imzala
        run: |
          set -e
          BT=$ANDROID_HOME/build-tools/34.0.0
          $BT/zipalign -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk app-aligned.apk
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > zai-release.keystore
          $BT/apksigner sign \
            --ks zai-release.keystore \
            --ks-key-alias zai \
            --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --key-pass pass:${{ secrets.KEY_PASSWORD }} \
            --out $APK_NAME app-aligned.apk
          $BT/apksigner verify --print-certs $APK_NAME | head -4
          ls -la $APK_NAME

      - name: Artifakt
        uses: actions/upload-artifact@v4
        with:
          name: ZaiMobile-${{ env.VERSION_NAME }}
          path: ${{ env.APK_NAME }}

      - name: Beta Release (pre-release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v7.0.0-beta.${{ github.run_number }}
          name: Z.ai Native v7.0.0-beta.${{ github.run_number }} (Beta)
          body: |
            ⚡ **Beta buraxılış** — hər push-da GitHub Actions-da avtomatik qurulur və imzalanır.

            **SIFIRDAN YENİDƏNQURMA — spec-əsaslı, STATİC DATA QADAĞASI İLƏ.**
            Köhnə kod tamamilə atıldı; hər şey canlı chat.z.ai API-dən gəlir.

            • **AÇILIŞ DÜZƏLDİ (əsl səbəb tapıldı)**: launch crash-i
              `setHideOverlayWindows` SecurityException idi — artıq qorunmalıdır
              və bütün ekranlar Robolectric açılış testləri ilə sübut olunur
            • **Static data YOXDUR**: modellər/söhbətlər/tarixçə/başlıqlar/adlar —
              yalnız canlı API; xəta halında düz mesaj + Retry, heç vaxt fallback
            • **Crash hesabatı**: gözlənilməz çıxışda növbəti açılış stack-i göstərir
              (kopyalanabilir) — "app açılmır" artıq diaqnoz olunur
            • **Protokol dəqiqliyi**: HMAC-SHA256 imza (RFC 4231 test vektoru),
              WAF backoff (hər cəhd üçün fresh imza), çoxsətirli SSE, 150s watchdog,
              401 qonaq self-heal, 4+3 retry matrisası, stop = qismən mətn
            • **Giriş**: email+şifrə native; captcha tələbi → sistem brauzeri +
              token (clipboard eyJ… aşkarlama, razılıqla) və ya əllə token
            • **Chat**: SSE streaming + fazalar, markdown (kod blokları + copy,
              keçidlər, siyahılar, sitatlar), tap-to-retry
            • **Söhbətlər**: canlı siyahı (pagination), server tarixçəsi
              (currentId→parentId zənciri), server-generasiyalı başlıqlar
            • **Fayllar**: SAF (icazəsiz) → 60MB limit → 2048px downscale →
              multipart upload
            • **Testlər (push-dan əvvəl məcburi)**: 38 test — imza/SSE/WAF/engine/
              markdown/session + Robolectric açılış smoke + LIVE protokol
              (datacenter IP-dən tam dövr WAF/captcha ilə məhdud — telefonda işləyir)
            • APK ~1.2MB; yeganə runtime asılılıq: coroutines; HTTP/JSON/crypto —
              platform daxili
          files: ${{ env.APK_NAME }}
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
