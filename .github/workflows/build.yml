name: Build APK (Kotlin)

on:
  push:
    branches: [main]
  workflow_dispatch:

# eyni anda yalnız son build işləsin — köhnələri ləğv et
concurrency:
  group: build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK (platform-34 + build-tools 34)
        run: |
          SDKM=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKM --licenses > /dev/null || true
          $SDKM --install "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Versiya
        run: |
          VC=$((7000 + ${{ github.run_number }}))
          VN=7.0.0-beta.${{ github.run_number }}
          APK=ZaiMobile-v$VN.apk
          echo "VC=$VC" >> $GITHUB_ENV
          echo "APK_NAME=$APK" >> $GITHUB_ENV
          echo "VERSION_NAME=$VN" >> $GITHUB_ENV
          echo "versionCode=$VC versionName=$VN → $APK"

      - name: Testlər (unit + Robolectric smoke — pushdan əvvəl məcburi)
        run: gradle test --no-daemon

      - name: Build (release)
        run: gradle assembleRelease --no-daemon -PzaiVersionCode=$VC -PzaiVersionName=$VERSION_NAME

      - name: Ölçü hesabatı
        run: |
          APK_RAW=app/build/outputs/apk/release/app-release-unsigned.apk
          echo "=== HESABAT ==="
          echo "unsigned APK: $(stat -c%s $APK_RAW) bayt ($(du -h $APK_RAW | cut -f1))"
          echo "Yeganə xarici asılılıq: kotlinx-coroutines-android 1.8.1"

      - name: Hizala + imzala
        run: |
          set -e
          BT=$ANDROID_HOME/build-tools/34.0.0
          $BT/zipalign -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk app-aligned.apk
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > zai-release.keystore
          $BT/apksigner sign \
            --ks zai-release.keystore \
            --ks-key-alias zai \
            --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --key-pass pass:${{ secrets.KEY_PASSWORD }} \
            --out $APK_NAME app-aligned.apk
          $BT/apksigner verify --print-certs $APK_NAME | head -4
          ls -la $APK_NAME

      - name: Artifakt
        uses: actions/upload-artifact@v4
        with:
          name: ZaiMobile-${{ env.VERSION_NAME }}
          path: ${{ env.APK_NAME }}

      - name: Beta Release (pre-release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v7.0.0-beta.${{ github.run_number }}
          name: Z.ai Native v7.0.0-beta.${{ github.run_number }} (Beta)
          body: |
            ⚡ **Beta buraxılış** — hər push-da GitHub Actions-da avtomatik qurulur və imzalanır.

            **v7.0 — TAM KOTLIN YENİDƏN YAZILIŞI: 100% native (WebView YOX), adi hesab girişi (email + şifrə).**

            • **Kotlin + korutinlər**: Rust/Slint kod bazası tamamilə tərk edildi; bütün UI native
              Android View-lar, bütün şəbəkə HttpURLConnection + korutinlər (Dispatchers.IO), axın
              Channel ilə UI-yə (Dərs 15-16-nın tətbiqi)
            • **WebView YOXDUR — webdən data almaq**: REST API (JSON), HTML scraping, SSE (server-sent
              events) axını — hamısı native HTTP (Dərs 18-in tətbiqi)
            • **FULLSCREEN düzəldi**: Activity həmişə tam pəncərəni tutur (köhnə Slint 915dp pinləmə
              bug-u struktur olaraq mümkün deyil); immersive sticky + WindowInsetsController (API 30+)
              + systemUiVisibility fallback + IME insets (Dərs 20-nin tətbiqi)
            • **Adi hesab girişi**: Google / Email / Github düymələri (saytın kimi) → email + şifrə
              ilə birbaşa native giriş (POST /api/v1/auths/signin), "Skip for now" = qonaq tokeni
            • **Captcha fallback**: sistem brauzerində bir dəfə giriş + tokeni köçürüb "Sign in with
              token" (clipboard-da eyJ… aşkarlananda təklif olunur)
            • **Tam veb protokolu**: HMAC-SHA256 imza, /api/v2/chat/completions SSE, WAF retry,
              çoxsətirli SSE birləşdirmə, avtomatik bərpa (4 cəhd), 401-də çıxış, tarixçə sinxronu
            • **Chat**: streaming mətn, fazalar (Thinking… / Searching…), markdown (başlıq, qalın,
              meyl, kod blokları + copy, siyahılar, sitatlar, keçidlər), tap-to-retry
            • **Söhbətlər**: sidebar (söhbət siyahısı, aç/sil, başlıq sinxronu), model + thinking
              effort seçimi
            • **Fayl əlavələri**: SAF seçici (60MB limit) → multipart upload → image_url/video_url/file_url
              content massivi; böyük şəkillər avtomatik 2048px JPEG-ə endirilir
            • APK yalnız ~1.7MB (Rust versiyası 9.9MB idi) — yeganə asılılıq coroutines
            • Kotlin dərs kursu (20 dərs, hamısı testlə doğrulanıb): `kotlin-dersleri/`
          files: ${{ env.APK_NAME }}
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
