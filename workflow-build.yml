name: Android APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: apk-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Kodu yüklə
        uses: actions/checkout@v4

      - name: JDK 17 quraşdır
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.7 quraşdır
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: İmza açarını deşifrə et
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/zai-release.keystore

      - name: Release APK qur
        env:
          ZAI_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ZAI_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ZAI_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APK-nı yenidən adlandır
        run: mv app/build/outputs/apk/release/app-release.apk ZaiMobile-v1.0.apk

      - name: APK-nı artifact kimi yüklə
        uses: actions/upload-artifact@v4
        with:
          name: ZaiMobile-APK
          path: ZaiMobile-v1.0.apk

      - name: GitHub Release yarat
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          name: Z.ai Mobile v1.0
          body: |
            Z.ai Android tətbiqi (WebView əsaslı)

            **Quraşdırma:** APK-nı endirin → telefonda açın → "Naməlum mənbələrdən quraşdırma" icazəsi verin.

            - chat.z.ai birbaşa tətbiqdə açılır
            - Şəkil/fayl göndərmə və endirmə
            - Swipe-to-refresh
            - Donma/qeyri-stabil bağlantı avtomatik bərpası
            - Səsli giriş (mikrofon) dəstəyi
            - Tam ekran video dəstəyi
          files: ZaiMobile-v1.0.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
