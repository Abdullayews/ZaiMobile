[package]
name = "zai-mobile"
version = "2.1.0"
edition = "2021"
description = "Z.ai native Android client — 100% Rust, WebView yoxdur"
license = "MIT"

[lib]
# cdylib Android üçün (NativeActivity), lib desktop üçün
crate-type = ["cdylib", "lib"]

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "default_fonts",
    "glow",
    "android-native-activity",
] }
egui = { version = "0.37", features = [
    "monochrome_emoji_fonts",
] } # emoji/simvol qlifləri (💬 ⚠ ℹ ⟳ …) üçün NotoEmoji zəncirə düşür
jni = "0.22" # Android sistem buferinə JNI girişi (egui-winit Android-də arboard YOXDUR)
ndk-context = "0.1" # JavaVM + Activity qlobal referansı (android-activity qeyd edir)
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
    "gzip",
    "cookies",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
winit = "0.30"

# Desktop-da pəncərə backend-ləri + log (Android-da yoxdur)
[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "0.37", features = ["x11", "wayland"] }
env_logger = "0.11"

[package.metadata.android]
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 35

[package.metadata.android.application]
label = "Z.ai"

[package.metadata.android.permission]
permissions = ["android.permission.INTERNET", "android.permission.ACCESS_NETWORK_STATE"]

[profile.release]
opt-level = 2
lto = "thin"
strip = true
codegen-units = 1
panic = "abort"
