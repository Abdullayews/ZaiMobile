[package]
name = "zai-mobile"
version = "6.0.0"
edition = "2021"
description = "Z.ai native Android client — 100% Rust + Slint, adi hesab girişi (WebView yoxdur)"
license = "MIT"

[lib]
# cdylib: Android NativeActivity .so; lib: desktop preview run
crate-type = ["cdylib", "lib"]

[dependencies]
# ---- Slint: hədəfə görə backend seçimi (aşağıda target-specific) ----
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# image: yalnız upload-öncəsi şəkil endirmə (downscale) üçün — minimum feature-lər
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip", "cookies", "multipart"] }

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-android-activity-06"] }
jni = "0.21"
ndk-context = "0.1"

[target.'cfg(not(target_os = "android"))'.dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg"] }
env_logger = "0.11"

[build-dependencies]
slint-build = "=1.18.1"

# Not: Android paket konfiqurasiyasının tək mənbəyi AndroidManifest.xml-dir
# (CI aapt2 ilə birbaşa onu istifadə edir). minSdk=24, targetSdk=34, icazələr
# və activity parametrləri orada saxlanılır.

[profile.release]
# opt-level "s": size-matrix ölçməsi (size-matrix.yml, run 41126551848) —
# opt2 19,517,720 bayt / 205s  →  opts 19,365,240 bayt (-152KB) / 120s;
# opt3 +338KB və ən yavaş, optz -643KB amma cihazda runtime ölçülməyib,
# fat-LTO opt-s altında cəmi +2.5KB (dəyəri yoxdur) → "s" + thin seçilib.
# İstilik yolunun (SSE parse 1.7µs / 60ms flush) ehtiyatı ~35,000x-dir.
opt-level = "s"
lto = "thin"
strip = true
codegen-units = 1
panic = "abort"
