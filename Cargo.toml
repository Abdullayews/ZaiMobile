[package]
name = "zai-mobile"
version = "6.0.0"
edition = "2021"
description = "Z.ai native Android client — 100% Rust + Slint, adi hesab girişi (WebView yoxdur)"
license = "MIT"

[lib]
# cdylib: Android NativeActivity .so; lib: desktop preview run
crate-type = ["cdylib", "lib"]

[dependencies]
# ---- Slint: Android-də xüsusi backend (Skia renderer + NativeActivity) ----
# Hədəfə görə backend seçimi — yalnız BİR backend aktiv olur:
#   Android: backend-android-activity-06 (native-activity + skia)
#   Desktop: backend-winit + renderer-femtovg (preview üçün)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2"] }

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-android-activity-06"] }
jni = "0.21"
ndk-context = "0.1"

[target.'cfg(not(target_os = "android"))'.dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg"] }
env_logger = "0.11"

[target.'cfg(target_os = "android")'.dependencies.reqwest]
version = "0.12"
default-features = false
features = ["blocking", "json", "rustls-tls", "gzip", "cookies", "multipart"]

[target.'cfg(not(target_os = "android"))'.dependencies.reqwest]
version = "0.12"
default-features = false
features = ["blocking", "json", "rustls-tls", "gzip", "cookies", "multipart"]

[build-dependencies]
slint-build = "=1.18.1"

[package.metadata.android]
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 34

[package.metadata.android.application]
label = "Z.ai"

[package.metadata.android.permission]
permissions = [
    "android.permission.INTERNET",
    "android.permission.ACCESS_NETWORK_STATE",
]

[profile.release]
opt-level = 2
lto = "thin"
strip = true
codegen-units = 1
panic = "abort"
