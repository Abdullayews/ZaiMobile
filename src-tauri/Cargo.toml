[package]
name = "zai-mobile"
version = "5.0.0"
description = "Z.ai — official-style mobile app: the real chat.z.ai experience in a native Android shell"
authors = ["Abdullayews"]
license = "MIT"
edition = "2021"

[lib]
name = "zai_mobile"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
codegen-units = 1
